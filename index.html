  const QUESTIONS = [[{"weight":1,"name":"Yên tĩnh"},{"weight":2,"name":"Có óc phân tích"},{"weight":3,"name":"Nhanh chóng"},{"weight":4,"name":"Biểu lộ cảm xúc"}],[{"weight":4,"name":"Vui vẻ vô tư"},{"weight":2,"name":"Chính xác"},{"weight":3,"name":"Bộc lộ quan điểm"},{"weight":1,"name":"Thong thả"}],[{"weight":1,"name":"Quan tâm người khác"},{"weight":3,"name":"Dám nghĩ dám làm"},{"weight":4,"name":"Hay pha trò"},{"weight":2,"name":"Tuân thủ luật lệ"}],[{"weight":1,"name":"Lắng nghe kiên nhẫn"},{"weight":3,"name":"Không khoan nhượng"},{"weight":2,"name":"Nói có căn cứ"},{"weight":4,"name":"Có sức thuyết phục"}],[{"weight":4,"name":"Dễ bắt chuyện"},{"weight":1,"name":"Né tranh luận"},{"weight":3,"name":"Ghét lề mề"},{"weight":2,"name":"Suy nghĩ thấu đáo"}],[{"weight":2,"name":"Cẩn trọng"},{"weight":3,"name":"Quyết định nhanh"},{"weight":4,"name":"Có nhiều thông tin"},{"weight":1,"name":"Tránh xung đột"}],[{"weight":1,"name":"Nói chuyện chậm rãi"},{"weight":3,"name":"Mạo hiểm"},{"weight":2,"name":"Ngăn nắp"},{"weight":4,"name":"Giao thiệp rộng"}],[{"weight":3,"name":"Chủ động thay đổi"},{"weight":1,"name":"Nhẹ nhàng thân thiện"},{"weight":4,"name":"Giao tiếp sôi nổi "},{"weight":2,"name":"Ngại tiếp xúc"}],[{"weight":1,"name":"Thư giãn"},{"weight":4,"name":"Lạc quan vui vẻ"},{"weight":3,"name":"Đạt mục đích đến cùng"},{"weight":2,"name":"Chú ý chi tiết"}],[{"weight":4,"name":"Vui khi được khen"},{"weight":1,"name":"Hiểu cảm xúc người khác"},{"weight":3,"name":"Người đầu tiên hành động"},{"weight":2,"name":"Suy nghĩ có lập luận"}],[{"weight":3,"name":"Muốn là làm"},{"weight":4,"name":"Được mọi người chú ý"},{"weight":2,"name":"Suy luận logic"},{"weight":1,"name":"Chậm mà chắc"}],[{"weight":1,"name":"Ổn định là trên hết"},{"weight":4,"name":"Cảm thấy  mãn nguyện"},{"weight":3,"name":"Muốn chiến thắng"},{"weight":2,"name":"Làm đúng cách"}],[{"weight":2,"name":"Nói chuyện thận trọng"},{"weight":4,"name":"Làm việc nhóm tốt"},{"weight":1,"name":"Không đòi hỏi người khác"},{"weight":3,"name":"Dám làm dám chịu"}],[{"weight":4,"name":"Dễ tiếp xúc người lạ"},{"weight":1,"name":"Không gây áp lực"},{"weight":3,"name":"Nóng tính"},{"weight":2,"name":"Không thiên vị"}],[{"weight":2,"name":"Làm đúng cách"},{"weight":4,"name":"Thường gây chú ý"},{"weight":1,"name":"Sẵn lòng giúp đỡ"},{"weight":3,"name":"Đưa ra định hướng"}],[{"weight":2,"name":"Tự kỷ luật"},{"weight":1,"name":"Ân cần"},{"weight":4,"name":"Dễ kết bạn"},{"weight":3,"name":"Quyết đoán"}],[{"weight":4,"name":"Gây chú ý"},{"weight":3,"name":"Người hành động"},{"weight":1,"name":"Được mọi người tâm sự"},{"weight":2,"name":"Suy đi tính lại"}],[{"weight":2,"name":"Làm cho tốt mọi việc"},{"weight":3,"name":"Nhận thử thách"},{"weight":4,"name":"Có khả năng thuyết phục"},{"weight":1,"name":"Giữ mối quan hệ"}],[{"weight":3,"name":"Sẵn sàng phát biểu"},{"weight":4,"name":"Truyền được cảm hứng"},{"weight":1,"name":"Kiên nhẫn lắng nghe"},{"weight":2,"name":"Làm đúng ngay từ đầu"}],[{"weight":3,"name":"Đi thẳng vào vấn đề"},{"weight":1,"name":"Ổn định chắc chắn"},{"weight":4,"name":"Hay cười"},{"weight":2,"name":"Không cần can dự"}],[{"weight":2,"name":"Thận trọng để nói đúng"},{"weight":4,"name":"Cảm xúc mạnh mẽ"},{"weight":3,"name":"Chờ là sốt ruột"},{"weight":1,"name":"Thường thỏa hiệp"}],[{"weight":1,"name":"Tránh gây sự"},{"weight":3,"name":"Không bỏ cuộc"},{"weight":4,"name":"Dễ dàng bị kích động"},{"weight":2,"name":"Hoạch định trước khi làm"}],[{"weight":2,"name":"Phạm ít sai sót"},{"weight":3,"name":"Cần phải tranh luận"},{"weight":4,"name":"Tính cách hướng ngoại"},{"weight":1,"name":"Chịu đựng nhẫn nhịn"}],[{"weight":3,"name":"Chắc chắn về bản thân"},{"weight":2,"name":"Học hỏi từ kinh nghiệm"},{"weight":4,"name":"Lạc quan"},{"weight":1,"name":"Bình tĩnh và dễ dãi"}],[{"weight":4,"name":"Dễ xúc động"},{"weight":3,"name":"Thường chỉ bảo người khác"},{"weight":1,"name":"Suy nghĩ tích cực"},{"weight":2,"name":"Im lặng quan sát"}],[{"weight":3,"name":"Hành động nhanh"},{"weight":4,"name":"Có thể động viên người khác"},{"weight":1,"name":"Sẵn sàng giúp đỡ"},{"weight":2,"name":"Âm thầm làm việc"}],[{"weight":1,"name":"Hòa nhã với mọi người"},{"weight":4,"name":"Được nhiều người mến"},{"weight":3,"name":"Làm điều mình muốn"},{"weight":2,"name":"Ít phát biểu trước đám đông"}],[{"weight":1,"name":"Tình cảm nồng ấm"},{"weight":4,"name":"Muốn có nhiều bạn "},{"weight":3,"name":"Cảm thấy mạnh mẽ"},{"weight":2,"name":"Tránh sự ồn ào"}]];
  // The public questionnaire contains weights 1..4, without a server scoring key.
  // These labels are inferred from the descriptions: 1=S, 2=C, 3=D, 4=I.
  const MAP = {1:'S',2:'C',3:'D',4:'I'};
  const ORDER = ['D','I','S','C'];
  const GROUPS = {
    D:{title:'Chủ động & quyết đoán',brief:'Hành động · Kết quả',description:'Ưu tiên hành động, xử lý vấn đề và tiến đến kết quả. Bạn có thể thấy mình thoải mái khi được chủ động quyết định.',prompt:'Khi cần quyết định nhanh, bạn có dành đủ khoảng trống để nghe ý kiến khác không?'},
    I:{title:'Kết nối & ảnh hưởng',brief:'Giao tiếp · Cảm hứng',description:'Ưu tiên giao tiếp, chia sẻ cảm xúc và tạo sự hào hứng. Bạn có thể thấy mình có năng lượng khi được kết nối với mọi người.',prompt:'Khi khởi đầu đầy hứng thú, điều gì giúp bạn theo sát công việc đến cuối?'},
    S:{title:'Ổn định & hỗ trợ',brief:'Kiên nhẫn · Hợp tác',description:'Ưu tiên sự ổn định, lắng nghe và giữ mối quan hệ. Bạn có thể thấy mình thoải mái khi mọi người hợp tác theo nhịp độ rõ ràng.',prompt:'Khi muốn giữ hòa khí, bạn có nói rõ nhu cầu và giới hạn của mình không?'},
    C:{title:'Phân tích & cẩn trọng',brief:'Logic · Chính xác',description:'Ưu tiên sự chính xác, căn cứ và làm việc có trình tự. Bạn có thể thấy mình thoải mái khi có đủ thông tin để cân nhắc.',prompt:'Khi cần thêm thông tin, bạn dựa vào đâu để biết lúc nào đã đủ để hành động?'}
  };
  const ENV = {work:'Làm việc',study:'Học tập',family:'Gia đình',friend:'Bạn bè',public:'Công cộng'};
  const app = document.getElementById('app');
  const dialog = document.getElementById('reset-dialog');
  let stage = 'intro', environment = 'work', current = 0, answers = blankAnswers(), chartMode = 'net';
  function blankAnswers(){return QUESTIONS.map(()=>({same:0,diff:0}));}
  function complete(a){return a && [1,2,3,4].includes(a.same) && [1,2,3,4].includes(a.diff) && a.same !== a.diff;}
  function completed(){return answers.filter(complete).length;}
  function escapeHTML(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function score(items){
    if(items.length!==QUESTIONS.length || !items.every(complete))throw new Error('Vui lòng trả lời đủ 28 câu, mỗi câu chọn hai mô tả khác nhau.');
    const result=Object.fromEntries(ORDER.map(key=>[key,{same:0,diff:0,net:0}]));
    for(const a of items){result[MAP[a.same]].same++;result[MAP[a.diff]].diff++;}
    for(const key of ORDER)result[key].net=result[key].same-result[key].diff;
    const max=Math.max(...ORDER.map(key=>result[key].net));
    return {groups:result,leading:ORDER.filter(key=>result[key].net===max),balanced:ORDER.every(key=>result[key].net===0)};
  }
  const CHART_MODES = {net:'Hiệu số',same:'Giống nhất',diff:'Khác nhất'};
  function chartGeometry(groups, mode='net'){
    const min=mode==='net'?-28:0,max=28;
    const ticks=mode==='net'?[-28,-21,-14,-7,0,7,14,21,28]:[0,7,14,21,28];
    const y=value=>40+(max-value)/(max-min)*260;
    return {min,max,ticks,zero:y(0),points:ORDER.map((key,i)=>({key,value:groups[key][mode],x:72+i*160,y:y(groups[key][mode])})),tickY:y};
  }
  function profileSVG(groups, mode='net'){
    const geometry=chartGeometry(groups,mode),label=CHART_MODES[mode];
    const signed=value=>mode==='net'&&value>0?'+'+value:String(value);
    const points=geometry.points.map(p=>`${p.x},${p.y}`).join(' ');
    const area=`M72,${geometry.zero} L${geometry.points.map(p=>`${p.x},${p.y}`).join(' L')} L552,${geometry.zero} Z`;
    return `<svg id="disc-line-chart" class="disc-line-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" role="img" aria-labelledby="line-title line-description"><title id="line-title">Biểu đồ D I S C — ${label}</title><desc id="line-description">Thang điểm cố định ${geometry.min} đến ${geometry.max}. ${geometry.points.map(p=>p.key+': '+signed(p.value)).join('; ')}. Điểm thống kê thô, chưa tương đương biểu đồ Vita Share.</desc><defs><linearGradient id="profile-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e49a52" stop-opacity="0.17"/><stop offset="100%" stop-color="#e49a52" stop-opacity="0.025"/></linearGradient></defs><rect width="640" height="395" rx="16" fill="#fffefa"/><text x="72" y="20" font-size="20" font-weight="600" font-family="Segoe UI,Arial,sans-serif" fill="#284a3c">${label} · ${ENV[environment]}</text>${geometry.ticks.map(v=>`<line x1="72" y1="${geometry.tickY(v)}" x2="552" y2="${geometry.tickY(v)}" stroke="${v===0?'#99ad9c':'#e8e9df'}" stroke-width="${v===0?'1.5':'1'}" ${v===0?'stroke-dasharray="5 5"':''}/><text x="51" y="${geometry.tickY(v)+4}" text-anchor="end" font-size="18" font-family="Segoe UI,Arial,sans-serif" fill="#68776e">${signed(v)}</text>`).join('')}${geometry.points.map(p=>`<line x1="${p.x}" y1="40" x2="${p.x}" y2="300" stroke="#e8e9df"/>`).join('')}<path d="${area}" fill="url(#profile-fill)"/><polyline id="profile-line" points="${points}" fill="none" stroke="#dc853b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${geometry.points.map(p=>`<g class="profile-point" data-group="${p.key}" data-value="${p.value}"><circle cx="${p.x}" cy="${p.y}" r="6" fill="#fffefa" stroke="#dc853b" stroke-width="3" tabindex="0" role="img" aria-label="${p.key}, ${label}: ${signed(p.value)}"><title>${p.key} · ${escapeHTML(GROUPS[p.key].title)}: ${signed(p.value)}</title></circle><text x="${p.x}" y="${p.y<=62?p.y+28:p.y-16}" text-anchor="middle" font-size="24" font-weight="600" font-family="Segoe UI,Arial,sans-serif" fill="#975022">${signed(p.value)}</text><text x="${p.x}" y="337" text-anchor="middle" font-size="28" font-weight="700" font-family="Segoe UI,Arial,sans-serif" fill="#284a3c">${p.key}</text></g>`).join('')}<text x="72" y="376" font-size="15" font-family="Segoe UI,Arial,sans-serif" fill="#68776e">Thống kê thô · Chưa tương đương biểu đồ Vita Share</text></svg>`;
  }
  function profileChart(groups){
    const label=CHART_MODES[chartMode];
    const detail=chartMode==='net'?'Lượt giống nhất trừ lượt khác nhất. Đường đứt là mức 0; điểm có thể âm hoặc dương.':chartMode==='same'?'Số lần bạn chọn mô tả giống mình nhất, trên thang 0 đến 28.':'Số lần bạn chọn mô tả khác mình nhất, trên thang 0 đến 28.';
    return `<section class="panel profile-panel" id="profile-chart" aria-labelledby="profile-heading"><div class="profile-heading-row"><div><p class="eyebrow">Bốn điểm, một góc nhìn</p><h2 id="profile-heading">Biểu đồ D–I–S–C</h2></div><div class="chart-switch" role="group" aria-label="Chọn dữ liệu biểu đồ">${Object.entries(CHART_MODES).map(([key,title])=>`<button type="button" data-chart-mode="${key}" aria-pressed="${chartMode===key}">${title}</button>`).join('')}</div></div><div class="profile-chart-grid"><figure class="profile-figure">${profileSVG(groups,chartMode)}<figcaption>${label} theo từng nhóm D, I, S, C. Biểu đồ thể hiện số đếm của bài làm này.</figcaption></figure><div class="profile-reading"><span class="line-legend"><span aria-hidden="true"></span>${label}</span><h3>Nhìn lại nhịp điệu của bạn.</h3><p>${detail}</p><div class="profile-values">${ORDER.map(key=>`<div><span>${key}</span><strong>${chartMode==='net'&&groups[key][chartMode]>0?'+':''}${groups[key][chartMode]}</strong></div>`).join('')}</div><p class="micro">Các nhóm cùng đạt điểm cao nhất được giữ nguyên. Không có nhóm tốt hơn hay kém hơn.</p><button class="button secondary" data-action="chart-download">Tải biểu đồ (.svg) ↓</button></div></div><p class="note">Đây là biểu đồ thống kê độc lập từ lựa chọn của bạn; <strong>chưa tương đương biểu đồ chuẩn hóa của Vita Share.</strong></p></section>`;
  }
  function limitations(){return `<details><summary>Nguồn câu hỏi và giới hạn kết quả</summary><p>Bộ 28 câu giữ nguyên từ bài DISC công khai của Vita Share (congcu.vita-share.com/disc), đối chiếu ngày 08/10/2026. Đây là bản độc lập tính kết quả trong trình duyệt, không phải sản phẩm chính thức của Vita Share.</p><p>Bản này đếm lượt “giống nhất”, “khác nhất” và hiệu số của chúng theo bốn nhóm D/I/S/C. Việc gán nhóm dựa trên nội dung mô tả. Cách quy đổi và chuẩn hóa biểu đồ của Vita Share chưa được xác minh, nên kết quả ở đây <strong>chưa tương đương biểu đồ gốc</strong>.</p><p>Dùng kết quả để suy ngẫm về hành vi trong bối cảnh bạn chọn. Điểm thấp không có nghĩa là năng lực kém; các điểm không phải tỷ lệ phần trăm tính cách.</p></details>`;}
  function focusHeading(){const h=app.querySelector('h1, h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}
  function intro(){
    app.innerHTML=`<section class="intro-top" aria-labelledby="intro-title"><div><p class="eyebrow">Một bài test, dành riêng cho bạn</p><h1 id="intro-title">Hiểu cách bạn<br><em>phản ứng.</em></h1><p class="lead">Khám phá xu hướng hành vi của mình qua 28 tình huống ngắn. Làm test và xem kết quả ngay tại đây, theo nhịp của bạn.</p><p class="micro">Không có đáp án đúng hay sai. Hãy chọn điều tự nhiên với bạn.</p></div><div class="style-grid" aria-label="Bốn xu hướng DISC">${ORDER.map(key=>`<div class="style-card ${key.toLowerCase()}"><span class="letter" aria-hidden="true">${key}</span><strong>${GROUPS[key].title}</strong><small>${GROUPS[key].brief}</small></div>`).join('')}</div></section>
    <div class="intro-bottom"><section class="panel"><h2>Trước khi bắt đầu</h2><ol class="numbered"><li><span>1</span><div>Chọn <b>một bối cảnh</b> và giữ bối cảnh đó xuyên suốt bài làm.</div></li><li><span>2</span><div>Mỗi câu có 4 mô tả. Chọn một <b>giống bạn nhất</b> và một <b>khác bạn nhất</b>.</div></li><li><span>3</span><div>Trả lời theo con người bạn đang là. Bạn có thể quay lại sửa trước khi xem kết quả. Đổi bối cảnh sẽ bắt đầu bài mới.</div></li></ol><div class="env-row"><div class="env-input"><label for="environment">Bạn muốn nhìn mình trong bối cảnh nào?</label><select id="environment">${Object.entries(ENV).map(([key,label])=>`<option value="${key}" ${environment===key?'selected':''}>${label}</option>`).join('')}</select></div><button class="button" data-action="start">Bắt đầu <span aria-hidden="true">↗</span></button></div><p class="note"><strong>Cách tính:</strong> kết quả là số lượt lựa chọn theo D/I/S/C, chưa tương đương biểu đồ chuẩn hóa của Vita Share.</p></section>
    <section class="panel"><h2>Một không gian riêng tư</h2><ul class="privacy-list"><li><span class="tick" aria-hidden="true">✓</span> Không hỏi họ tên, email hay số điện thoại.</li><li><span class="tick" aria-hidden="true">✓</span> Không gửi câu trả lời qua Internet.</li><li><span class="tick" aria-hidden="true">✓</span> Không tự lưu bài làm vào trình duyệt.</li><li><span class="tick" aria-hidden="true">✓</span> Bạn tự chọn tải hoặc in kết quả trên máy.</li></ul><p class="hosting-note">Khi mở bản web, nhà cung cấp hosting có thể ghi nhận IP và lượt truy cập. Ứng dụng không gửi câu trả lời hoặc kết quả lên máy chủ. Bạn cũng có thể lưu trang để dùng ngoại tuyến.</p><p class="note">Câu trả lời chỉ giữ trong phiên trang đang mở. <strong>Tải lại hoặc đóng trang sẽ mất bài làm.</strong> File bạn chủ động tải về sẽ vẫn nằm trên máy cho đến khi bạn xóa.</p>${limitations()}</section></div>`;
  }
  function question(restoreFocus){
    const q=QUESTIONS[current],a=answers[current],done=completed();
    app.innerHTML=`<div class="section-head"><div><p class="eyebrow">Bối cảnh · ${ENV[environment]}</p><h1>Chọn điều <em>tự nhiên với bạn.</em></h1></div><button class="text-button" data-action="reset">Xóa bài làm</button></div><div class="question-layout"><section class="panel question-panel" aria-labelledby="question-title"><div class="progress-meta"><strong>Câu ${current+1} / ${QUESTIONS.length}</strong><span>Đã trả lời ${done} / ${QUESTIONS.length}</span></div><progress value="${done}" max="${QUESTIONS.length}" aria-label="Số câu đã trả lời"></progress><h2 id="question-title">Trong môi trường ${ENV[environment].toLowerCase()}, tôi…</h2><p class="question-help">Đọc cả bốn mô tả. Chọn một ở mỗi cột, trên hai dòng khác nhau.</p><table class="choice-table"><thead><tr><th scope="col">Mô tả</th><th class="choice-col same-head" scope="col">Giống tôi<br>nhất</th><th class="choice-col diff-head" scope="col">Khác tôi<br>nhất</th></tr></thead><tbody>${q.map((o,index)=>`<tr><th scope="row">${escapeHTML(o.name.trim())}</th>${['same','diff'].map(kind=>`<td><label class="radio-label ${kind}" for="${kind}-${index}"><input id="${kind}-${index}" type="radio" name="${kind}-${current}" value="${o.weight}" data-kind="${kind}" aria-label="${kind==='same'?'Giống tôi nhất':'Khác tôi nhất'}: ${escapeHTML(o.name.trim())}" ${a[kind]===o.weight?'checked':''} ${a[kind==='same'?'diff':'same']===o.weight?'disabled':''}></label></td>`).join('')}</tr>`).join('')}</tbody></table><p class="selection-help" role="status">${complete(a)?'Đã chọn đủ hai mô tả. Bạn có thể tiếp tục.':'Chọn đủ một mô tả giống nhất và một mô tả khác nhất.'}</p><div class="question-actions"><button class="button secondary" data-action="prev">← ${current===0?'Giới thiệu':'Câu trước'}</button><button class="button" data-action="next" ${complete(a)?'':'disabled'}>${current===QUESTIONS.length-1?'Xem kết quả':'Câu tiếp theo'} <span aria-hidden="true">→</span></button></div></section><aside class="side-panel" aria-label="Tiến độ bài làm"><h3>Chậm một chút cũng được.</h3><p>Chọn câu bất kỳ để xem lại hoặc sửa câu trả lời.</p><nav class="question-nav" aria-label="Đi đến câu hỏi">${QUESTIONS.map((_,index)=>`<button class="question-jump ${complete(answers[index])?'done':''} ${index===current?'current':''}" data-question="${index}" aria-label="Câu ${index+1}, ${complete(answers[index])?'đã trả lời':'chưa trả lời'}" ${index===current?'aria-current="step"':''}>${index+1}</button>`).join('')}</nav><div class="nav-key"><span aria-hidden="true"></span> Đã trả lời</div><p class="side-hint"><b>Nhớ về bối cảnh ${ENV[environment].toLowerCase()}.</b><br>Chọn điều thường xảy ra với bạn, kể cả khi điều đó không giống hình ảnh bạn mong muốn.</p><p class="note">Bài làm chỉ ở trong phiên này. Đóng hoặc tải lại trang sẽ xóa câu trả lời.</p></aside></div>`;
    if(restoreFocus){document.getElementById(restoreFocus)?.focus({preventScroll:true});}
  }
  function results(){
    const result=score(answers),{groups,leading,balanced}=result;
    const title=balanced?'Bốn xu hướng có hiệu số cân bằng':`Xu hướng nổi bật: ${leading.join(' · ')}`;
    const description=balanced?'Trong bài làm này, số lượt chọn giống nhất và khác nhất của từng nhóm bằng nhau. Hãy xem từng nhóm và đối chiếu với tình huống thực tế của bạn.':leading.length>1?'Có nhiều nhóm cùng đạt hiệu số cao nhất. Hãy đọc chúng cùng nhau, thay vì gắn mình vào một nhóm duy nhất.':'Nhóm này có hiệu số “giống nhất trừ khác nhất” cao nhất trong bài làm của bạn. Đây là một gợi ý để nhìn lại hành vi trong bối cảnh đã chọn.';
    app.innerHTML=`<div class="section-head"><div><p class="eyebrow">Hoàn thành 28 / 28 câu · ${ENV[environment]}</p><h1>Kết quả <em>của bạn.</em></h1></div><button class="text-button" data-action="reset">Xóa và làm lại</button></div><section class="result-hero" aria-labelledby="result-title"><div><p class="eyebrow">Bản tham khảo theo số lượt chọn</p><h2 id="result-title">${title}</h2><p>${description}</p></div><div class="result-letters" aria-hidden="true">${leading.map(key=>`<span>${key}</span>`).join('')}</div></section>${profileChart(groups)}<div class="result-grid"><section class="panel"><h2>Bức tranh từ lựa chọn của bạn</h2><p class="micro">Mỗi thanh là số lượt chọn, trên thang từ 0 đến 28.</p><div class="chart-legend"><span><span class="legend-square"></span>Giống nhất</span><span><span class="legend-square least"></span>Khác nhất</span></div>${ORDER.map(key=>`<div class="chart-row"><div class="chart-row-head"><strong>${key} · ${GROUPS[key].title}</strong><span>${groups[key].same} / ${groups[key].diff}</span></div><svg class="chart-bars" viewBox="0 0 280 22" preserveAspectRatio="none" role="img" aria-label="${key}: giống nhất ${groups[key].same} lượt, khác nhất ${groups[key].diff} lượt"><rect class="bar-bg" width="280" height="8" rx="3"/><rect class="bar-bg" y="14" width="280" height="8" rx="3"/><rect class="bar-most" width="${groups[key].same*10}" height="8" rx="3"/><rect class="bar-least" y="14" width="${groups[key].diff*10}" height="8" rx="3"/></svg></div>`).join('')}<table class="score-table"><caption class="sr-only">Số lượt chọn và hiệu số theo nhóm DISC</caption><thead><tr><th scope="col">Nhóm</th><th scope="col">Giống nhất</th><th scope="col">Khác nhất</th><th scope="col">Hiệu số</th></tr></thead><tbody>${ORDER.map(key=>`<tr><th scope="row">${key}</th><td>${groups[key].same}</td><td>${groups[key].diff}</td><td class="net">${groups[key].net>0?'+':''}${groups[key].net}</td></tr>`).join('')}</tbody></table><p class="note"><strong>Hiệu số = giống nhất − khác nhất.</strong> Tổng lượt giống nhất là 28, tổng lượt khác nhất là 28. Đây là số đếm, không phải phần trăm tính cách hay điểm đánh giá năng lực.</p></section><section class="panel"><h2>Đọc kết quả bằng trải nghiệm của bạn</h2>${(balanced?ORDER:leading).map(key=>`<div class="explain-block"><h3>${key} · ${GROUPS[key].title}</h3><p>${GROUPS[key].description}</p><p><strong>Thử tự hỏi:</strong> ${GROUPS[key].prompt}</p></div>`).join('')}<p class="note">Mọi người có thể thể hiện cả bốn xu hướng ở các mức khác nhau. Bối cảnh, cách bạn hiểu mô tả và thời điểm làm test đều ảnh hưởng đến câu trả lời.</p>${limitations()}</section></div><section class="panel result-bottom"><h2>Giữ lại nếu bạn muốn</h2><p class="micro">Kết quả chưa được tự lưu. Bạn có thể tải một bản về máy hoặc in ra giấy / lưu PDF.</p><div class="result-actions"><button class="button" data-action="download">Tải kết quả (.txt) ↓</button><button class="button secondary" data-action="json">Lưu bài làm (.json)</button><button class="button secondary" data-action="print">In / Lưu PDF</button><button class="button secondary" data-action="review">Sửa câu trả lời</button></div><p class="status-message" role="status" id="result-status"></p><details class="response-review"><summary>Xem lại 28 câu trả lời</summary><ol>${QUESTIONS.map((q,index)=>`<li><b>Giống nhất:</b> ${escapeHTML(q.find(o=>o.weight===answers[index].same).name.trim())}<br><b>Khác nhất:</b> ${escapeHTML(q.find(o=>o.weight===answers[index].diff).name.trim())}</li>`).join('')}</ol></details><p class="note print-only">Bản độc lập dùng cùng 28 câu của Vita Share; kết quả là số lượt chọn theo nhóm, chưa tương đương biểu đồ chuẩn hóa của trang gốc. Không có thông tin nhận dạng trong bản kết quả này.</p></section>`;
  }
  function reportText(){
    const r=score(answers);
    return ['DISC RIÊNG TƯ — KẾT QUẢ THAM KHẢO',`Bối cảnh: ${ENV[environment]}`,'Đã trả lời: 28/28 câu','', 'Nhóm | Giống nhất | Khác nhất | Hiệu số',...ORDER.map(key=>`${key} | ${r.groups[key].same} | ${r.groups[key].diff} | ${r.groups[key].net}`),'',r.balanced?'Bốn nhóm có hiệu số bằng 0.':`Nhóm cùng có hiệu số cao nhất: ${r.leading.join(', ')}`,'','Cách tính: đếm số lượt giống nhất và khác nhất; hiệu số = giống nhất - khác nhất. Các điểm không phải phần trăm hay điểm năng lực.','Câu hỏi lấy từ bài DISC công khai của Vita Share, đối chiếu 08/10/2026. Gán nhóm từ mô tả: weight 1=S, 2=C, 3=D, 4=I. Chưa xác minh cách quy đổi/chuẩn hóa của Vita Share; kết quả không được khẳng định tương đương biểu đồ gốc.','Không có họ tên, email hay số điện thoại trong bản kết quả.','',...ORDER.flatMap(key=>[`${key} — ${GROUPS[key].title}`,GROUPS[key].description,`Tự hỏi: ${GROUPS[key].prompt}`,''])].join('\n');
  }
  function download(text,type,name){
    const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    document.getElementById('result-status').textContent='Đã yêu cầu trình duyệt lưu file vào máy. Bạn tự quản lý bản tải về này.';
  }
  function render(){if(stage==='intro')intro();else if(stage==='test')question();else results();}
  app.addEventListener('change',event=>{
    const input=event.target;
    if(stage!=='test'||!input.matches('input[data-kind]'))return;
    const kind=input.dataset.kind,value=Number(input.value),other=kind==='same'?'diff':'same';
    if(![1,2,3,4].includes(value)||answers[current][other]===value)return;
    answers[current][kind]=value;question(input.id);
  });
  app.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.question!==undefined){current=Number(target.dataset.question);question();focusHeading();return;}
    if(target.dataset.chartMode && CHART_MODES[target.dataset.chartMode]){chartMode=target.dataset.chartMode;document.getElementById('profile-chart').outerHTML=profileChart(score(answers).groups);app.querySelector('[data-chart-mode='+chartMode+']').focus({preventScroll:true});return;}
    switch(target.dataset.action){
      case 'start':{const chosen=document.getElementById('environment').value;if(chosen!==environment){answers=blankAnswers();current=0;}environment=chosen;stage='test';question();focusHeading();break;}
      case 'prev':if(current===0){stage='intro';intro();}else{current--;question();}focusHeading();break;
      case 'next':if(!complete(answers[current]))break;if(current<QUESTIONS.length-1){current++;question();}else if(completed()<QUESTIONS.length){current=answers.findIndex(a=>!complete(a));question();app.querySelector('.selection-help').textContent='Câu này chưa hoàn thành. Hãy trả lời đủ các câu để xem kết quả.';}else{stage='result';results();}focusHeading();break;
      case 'reset':dialog.showModal();break;
      case 'chart-download':download(profileSVG(score(answers).groups,chartMode),'image/svg+xml;charset=utf-8','disc-bieu-do-'+chartMode+'.svg');break;
      case 'review':stage='test';current=0;question();focusHeading();break;
      case 'download':download(reportText(),'text/plain;charset=utf-8','disc-ket-qua-rieng-tu.txt');break;
      case 'json':download(JSON.stringify({version:1,questionnaire:'Vita Share DISC public 28 questions, accessed 2026-10-08',environment,scoring:'Raw counts only; 1=S, 2=C, 3=D, 4=I inferred from descriptions. Not validated as the original server scoring.',answers:answers.map(a=>({...a})),result:score(answers)},null,2),'application/json;charset=utf-8','disc-bai-lam-rieng-tu.json');break;
      case 'print':window.print();break;
    }
  });
  document.getElementById('reset-cancel').addEventListener('click',()=>dialog.close());
  document.getElementById('reset-confirm').addEventListener('click',()=>{dialog.close();answers=blankAnswers();current=0;environment='work';stage='intro';intro();focusHeading();});
  render();
})();
</script></body></html>
